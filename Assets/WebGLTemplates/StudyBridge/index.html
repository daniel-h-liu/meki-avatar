<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>
    <!-- STUDY EMBED: this template is Unity's own Minimal template plus two
         additions, both marked "STUDY BRIDGE" / "STUDY EMBED" in this file:
         (1) the canvas fills whatever box it is placed in (the website's
         iframe) instead of a fixed pixel size, with page scroll disabled;
         (2) the postMessage listener that relays the website's messages
         into Unity. Minimal has no footer bar and no TemplateData folder,
         so nothing needs hiding and no style.css is involved.
         IMPORTANT: never start a line in this file with the "#" character
         other than Unity's own #if / #endif directives — Unity's template
         preprocessor treats any line beginning with # as a directive. -->
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
      body { display: flex; align-items: center; justify-content: center; }
    </style>
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <!-- STUDY EMBED: width/height attributes kept (initial render size).
         The CSS size is the largest 16:9 box that fits the iframe
         (min of full width / full height-times-16:9), centered by the flex
         body above with black bars on any spare side, so the tool always
         keeps a 16:9 ratio whatever box the website gives it. Unity's
         default matchWebGLToCanvasSize re-renders at that displayed size.
         display:block removes the small inline-element gap under a canvas,
         a common cause of a stray scrollbar. -->
    <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1" style="display: block; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}}"></canvas>
#if SHOW_DIAGNOSTICS
    <div id="unity-footer">
        <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
    </div>
#endif
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";

#if SHOW_DIAGNOSTICS
        // position the diagnostics icon in the corner on the canvas
        let diagnostics_icon = document.getElementById("diagnostics-icon");
        diagnostics_icon.style.position = "fixed";
        diagnostics_icon.style.bottom = "10px";
        diagnostics_icon.style.right = "0px";
        canvas.after(diagnostics_icon);
#endif
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {

        // ============================================================
        // STUDY BRIDGE — receives 'init' (new participantId/excerptId,
        // doubles as a reset trigger) and 'submit-rejected' (re-enable
        // Submit without resetting) from the parent page, and relays each
        // into Unity via SendMessage. Outbound messages (unity-ready,
        // avatar-response) are sent from the C# side via
        // Assets/Plugins/WebGL/UnityBridge.jslib, not from here.
        //
        // TODO before real deployment: this currently accepts a message
        // from ANY origin. Replace the commented-out check below with a
        // real allowlist (your website's actual production origin) to
        // match the origin-checking already done on the website side
        // (originIsTrusted() / DEV_MODE in index.html).
        window.addEventListener("message", function (event) {
          // if (event.origin !== "https://your-production-origin.example") return;
          if (!event.data || typeof event.data !== "object") return;

          if (event.data.type === "init") {
            var json = JSON.stringify({
              participantId: event.data.participantId,
              excerptId: event.data.excerptId
            });
            unityInstance.SendMessage("SessionManager", "InitializeSessionFromWeb", json);
          }

          if (event.data.type === "submit-rejected") {
            unityInstance.SendMessage("SessionManager", "OnSubmitRejected");
          }
        });
        // ============================================================

#if SHOW_DIAGNOSTICS
        document.getElementById("diagnostics-icon").onclick = () => {
            unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
        };
#endif
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
